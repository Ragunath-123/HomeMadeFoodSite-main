<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">

  <title>Admin Login - Amma's Homemade Foods</title>
  <meta name="description" content="Admin login for Amma's Homemade Foods.">
  <meta name="robots" content="noindex, nofollow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg fixed-top" id="mainNav">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <i class="fa-solid fa-utensils"></i> Amma's Homemade Foods
      </a>
      <div class="d-flex align-items-center gap-2 ms-auto">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
          <i class="fa-solid fa-moon"></i>
        </button>
        <a href="index.html" class="btn btn-sm btn-outline-secondary">
          <i class="fa-solid fa-arrow-left me-1"></i>Back to Site
        </a>
      </div>
    </div>
  </nav>

  <!-- Login Section -->
  <section class="section-padding section-cream" style="padding-top:120px">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
          <div class="auth-card">
            <div class="text-center mb-4">
              <div class="auth-logo">
                <i class="fa-solid fa-user-shield"></i>
              </div>
              <h2 class="section-title" style="font-size:1.5rem">Admin Login</h2>
              <p style="color:var(--gray-600);font-size:0.9rem">Authorized personnel only</p>
            </div>

            <form id="loginForm" novalidate>
              <div class="mb-3">
                <label for="loginMobile" class="form-label">Admin Mobile Number</label>
                <div class="input-group">
                  <span class="input-group-text">+91</span>
                  <input type="tel" class="form-control" id="loginMobile" required
                    pattern="[0-9]{10}" maxlength="10"
                    placeholder="Enter 10-digit number">
                </div>
                <div class="invalid-feedback">Please enter a valid 10-digit mobile number.</div>
              </div>
              <div id="loginError" class="alert alert-danger d-none" style="font-size:0.85rem"></div>
              <button type="submit" class="btn w-100 auth-btn" id="btnLogin">
                <i class="fa-solid fa-right-to-bracket me-1"></i>Login
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom" style="margin-top:0;border-top:none">
        <p>&copy; 2026 Amma's Homemade Foods</p>
      </div>
    </div>
  </footer>

  <!-- Toast -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:9999">
    <div id="authToast" class="toast align-items-center text-bg-success border-0" role="alert">
      <div class="d-flex">
        <div class="toast-body" id="authToastMsg">Success!</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    (function() {
      // If already logged in as admin, redirect to admin panel
      if (window.AmmaAuth.isLoggedIn()) {
        window.location.href = 'admin.html';
        return;
      }

      var loginForm = document.getElementById('loginForm');
      loginForm.addEventListener('submit', function(e) {
        e.preventDefault();
        var mobile = document.getElementById('loginMobile').value.trim();
        var errorEl = document.getElementById('loginError');

        if (!/^[0-9]{10}$/.test(mobile)) {
          loginForm.classList.add('was-validated');
          return;
        }

        document.getElementById('btnLogin').disabled = true;
        document.getElementById('btnLogin').innerHTML = '<i class="fa-solid fa-spinner fa-spin me-1"></i>Verifying...';

        window.AmmaAuth.login(mobile, function(err, user) {
          document.getElementById('btnLogin').disabled = false;
          document.getElementById('btnLogin').innerHTML = '<i class="fa-solid fa-right-to-bracket me-1"></i>Login';

          if (err) {
            errorEl.textContent = err;
            errorEl.classList.remove('d-none');
            return;
          }

          errorEl.classList.add('d-none');
          showToast('Welcome, ' + user.name + '!');

          setTimeout(function() {
            window.location.href = 'admin.html';
          }, 800);
        });
      });

      function showToast(msg) {
        var toastEl = document.getElementById('authToast');
        var msgEl = document.getElementById('authToastMsg');
        if (toastEl && msgEl) {
          msgEl.textContent = msg;
          var toast = new bootstrap.Toast(toastEl, { delay: 2500 });
          toast.show();
        }
      }
    })();
  </script>
</body>
</html>
